<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ bot_name }} | Study Assistant</title>
<style>
  :root {
    --desk: #2b2d42;
    --paper: #fffdf6;
    --paper-line: #dbe4f0;
    --margin-line: #f4a6a6;
    --ink: #24304a;
    --ink-dim: #7a8499;
    --accent: #ff8a3d;
    --accent-dark: #e26a1c;
    --highlight: #ffe98a;
    --user-note: #d9ecff;
    --bot-note: #fff6c9;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    color: var(--ink);
    background: var(--desk);
  }

  body {
    background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 45%),
                      radial-gradient(circle at 80% 80%, rgba(255,138,61,0.08), transparent 40%);
  }

  .app-shell {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 24px;
  }

  header.topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    background: var(--paper);
    border-radius: 14px 14px 0 0;
    border-bottom: 3px solid var(--accent);
  }

  .pencil {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--highlight);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    transform: rotate(-8deg);
    box-shadow: 2px 3px 0 rgba(0,0,0,0.12);
    flex-shrink: 0;
  }

  .title-block h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.3px;
  }
  .title-block p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--ink-dim);
  }

  .reset-btn {
    margin-left: auto;
    background: transparent;
    border: 2px dashed var(--accent);
    color: var(--accent-dark);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .reset-btn:hover {
    background: var(--accent);
    color: #ffffff;
    border-style: solid;
  }

  .topic-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 18px;
    background: #fff7e6;
    border-bottom: 1px solid var(--paper-line);
  }
  .topic-strip button {
    border: none;
    background: var(--highlight);
    color: var(--ink);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transform: rotate(-1deg);
    transition: transform 0.15s ease;
  }
  .topic-strip button:nth-child(even) { transform: rotate(1deg); background: #cdeedd; }
  .topic-strip button:hover { transform: rotate(0deg) scale(1.06); }

  main.chat-window {
    flex: 1;
    background-color: var(--paper);
    background-image:
      linear-gradient(90deg, transparent 58px, var(--margin-line) 58px, var(--margin-line) 60px, transparent 60px),
      repeating-linear-gradient(transparent, transparent 31px, var(--paper-line) 31px, var(--paper-line) 32px);
    padding: 18px 18px 18px 76px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 46vh;
    max-height: 60vh;
  }

  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 92%;
    animation: pop 0.25s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }

  .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink-dim);
    align-self: flex-start;
    margin-top: 10px;
    flex-shrink: 0;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 4px 12px 12px 12px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 2px 3px 0 rgba(0,0,0,0.1);
  }
  .msg-row.bot .bubble { background: var(--bot-note); border-left: 4px solid var(--accent); }
  .msg-row.user .bubble {
    background: var(--user-note);
    border-right: 4px solid #4a90d9;
    border-radius: 12px 4px 12px 12px;
  }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  form.composer {
    display: flex;
    gap: 10px;
    background: var(--paper);
    border-top: 3px double var(--paper-line);
    border-radius: 0 0 14px 14px;
    padding: 10px 14px;
  }

  .composer textarea {
    flex: 1;
    resize: none;
    border: 2px solid var(--paper-line);
    border-radius: 10px;
    outline: none;
    background: #ffffff;
    color: var(--ink);
    font-size: 14.5px;
    font-family: inherit;
    padding: 10px 12px;
    max-height: 120px;
    transition: border-color 0.2s ease;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer textarea::placeholder { color: var(--ink-dim); }

  .send-btn {
    align-self: flex-end;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    height: 44px;
    box-shadow: 0 3px 0 var(--accent-dark);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .send-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--accent-dark); }
  .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .footnote {
    text-align: center;
    color: #b9bdd0;
    font-size: 11.5px;
    margin-top: 12px;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #e3d9b8; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 560px) {
    main.chat-window { padding-left: 48px; background-position: -10px 0, 0 0; }
    .msg-row { max-width: 100%; }
    .tag { display: none; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="pencil">&#9998;</div>
      <div class="title-block">
        <h1>{{ bot_name }}</h1>
        <p>Your general study companion for every subject</p>
      </div>
      <button class="reset-btn" id="resetBtn" type="button">New Page</button>
    </header>

    <div class="topic-strip" id="topicStrip">
      <button type="button">Maths</button>
      <button type="button">Science</button>
      <button type="button">History</button>
      <button type="button">Geography</button>
      <button type="button">Grammar</button>
      <button type="button">Study Tips</button>
    </div>

    <main class="chat-window" id="chatWindow">
      <div class="msg-row bot">
        <span class="tag">Buddy</span>
        <div class="bubble">Hi! I'm {{ bot_name }}. Pick a subject above or ask me any study question and we will work through it step by step.</div>
      </div>
    </main>

    <form class="composer" id="chatForm">
      <textarea id="userInput" rows="1" placeholder="Type your study question here..."></textarea>
      <button class="send-btn" id="sendBtn" type="submit">Send</button>
    </form>

    <p class="footnote">I only answer study and learning related questions.</p>
  </div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');
  const topicStrip = document.getElementById('topicStrip');

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function buildRow(sender, tagText) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;

    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = tagText;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    row.appendChild(tag);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollToBottom();
    return { row, bubble };
  }

  function addMessage(text, sender) {
    const { bubble } = buildRow(sender, sender === 'user' ? 'You' : 'Buddy');
    bubble.textContent = text;
  }

  function showTyping() {
    const { row, bubble } = buildRow('bot', 'Buddy');
    row.id = 'typingRow';
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  }

  function hideTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function autoResize() {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  }

  async function sendMessage(message) {
    addMessage(message, 'user');
    userInput.value = '';
    autoResize();
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await response.json();
      hideTyping();
      addMessage(data.reply || 'No response received.', 'bot');
    } catch (error) {
      hideTyping();
      addMessage('Network error: could not reach the server.', 'bot');
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  chatForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const message = userInput.value.trim();
    if (message) sendMessage(message);
  });

  userInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      chatForm.requestSubmit();
    }
  });

  userInput.addEventListener('input', autoResize);

  topicStrip.addEventListener('click', (event) => {
    if (event.target.tagName !== 'BUTTON') return;
    userInput.value = 'Help me study ' + event.target.textContent;
    userInput.focus();
    autoResize();
  });

  resetBtn.addEventListener('click', async () => {
    await fetch('/reset', { method: 'POST' });
    chatWindow.innerHTML = '';
    addMessage('Fresh page started. What would you like to study?', 'bot');
  });
</script>
</body>
</html>
